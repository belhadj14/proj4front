<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <title>Document</title>
</head>
<body>
    <header>
        <div class="container-fluid p-0">
            <div class="header-content">
                <a href="index.html" id="sc">Shopping cart</a>
                

            </div>
        </div>
    </header>
    <div class="container pt-5 bg-danger-subtle">
        
        <form class="pt-5 rf">
            <h1 class="text-center pt-1">Login Form</h1>
          <div class="row g-3 w-50 m-auto">
          <div >
            <label for="exampleInputEmail1" class="form-label text-start">Email address</label>
            <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
            <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
          </div>
          <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Password</label>
            <input type="password" class="form-control" id="exampleInputPassword1">
          </div>
        
         <div class="col-12">
                    <button type="submit" class="btn btn-primary" id="btnLogin">Log in</button>
        </div>
        <p class="pt-2">Haven't an account ? <a href="register.html">Register</a></p>
        </form>
    </div>
    
    <script src="js/login.js"></script>
</body>
</html>
